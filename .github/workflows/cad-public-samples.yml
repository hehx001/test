name: Public CAD sample verification
on:
  push:
    branches: [feat/mechanical-cad-audit-mvp]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CAD analysis dependencies
        working-directory: cad-audit-mvp
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest cadquery httpx==0.28.1
      - name: Run existing unit tests
        working-directory: cad-audit-mvp
        run: python -m pytest -q tests/test_audit.py
      - name: Verify both model adapters with mock requests
        working-directory: cad-audit-mvp
        run: python -m pytest -q tests/test_models.py
      - name: Verify local credential configuration
        working-directory: cad-audit-mvp
        run: python -m pytest -q tests/test_local_config.py
      - name: Verify independent review regressions
        working-directory: cad-audit-mvp
        run: python -m pytest -q tests/test_review_regressions.py
      - name: Verify dense browser preview safely
        working-directory: cad-audit-mvp
        run: node tests/test_preview.js
      - name: Run tests on independently authored DXF and STEP files
        if: always()
        working-directory: cad-audit-mvp
        run: python -m pytest -s -q tests/test_public_samples.py
