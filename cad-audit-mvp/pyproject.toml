[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "mechanical-cad-audit"
version = "0.1.0"
description = "Mechanical drawing audit prototype (DXF/BOM/STEP)"
requires-python = ">=3.11,<3.15"
dependencies = ["fastapi>=0.115,<0.130", "uvicorn>=0.30,<1.0", "python-multipart>=0.0.9,<1.0", "ezdxf>=1.3,<2.0", "cadquery-ocp>=7.8,<8.0", "httpx>=0.28,<0.29", "python-dotenv>=1.0,<2.0"]

[tool.setuptools.packages.find]
include = ["cad_audit*"]

[tool.setuptools.package-data]
cad_audit = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
